<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #0D0E11;
      color: #F5F6F7;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 13px;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      border-bottom: 1px solid #232529;
      padding-bottom: 10px;
    }
    .logo {
      width: 22px;
      height: 22px;
    }
    .title {
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.02em;
    }
    .badge {
      font-size: 10px;
      background: rgba(242, 193, 78, 0.15);
      color: #F2C14E;
      padding: 2px 6px;
      border-radius: 4px;
      margin-left: auto;
      font-weight: 600;
    }
    .card {
      background: #17181C;
      border: 1px solid #2A2C32;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: #8A8D96;
    }
    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #6b7280;
      transition: all 0.2s;
    }
    .dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }
    .btn-connect {
      width: 100%;
      background: #1D1F24;
      color: #F5F6F7;
      border: 1px solid #2A2C32;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 8px;
      transition: all 0.15s;
    }
    .btn-connect:hover {
      background: #252830;
      border-color: #F2C14E;
      color: #F2C14E;
    }
    .btn-primary {
      width: 100%;
      background: #F2C14E;
      color: #0D0E11;
      border: none;
      border-radius: 6px;
      padding: 8px 12px;
      font-weight: 600;
      font-size: 12.5px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: opacity 0.15s;
    }
    .btn-primary:hover {
      opacity: 0.92;
    }
    .tab-info {
      font-size: 11.5px;
      color: #8A8D96;
      margin-top: 8px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .footer {
      font-size: 11px;
      color: #55585F;
      text-align: center;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="header">
    <svg class="logo" viewBox="0 0 32 32" fill="none">
      <path d="M16 2L28 9V23L16 30L4 23V9L16 2Z" stroke="#F2C14E" stroke-width="2.2" fill="none"/>
    </svg>
    <span class="title">Hive Bridge</span>
    <span class="badge">MANUS CORE</span>
  </div>

  <div class="card">
    <div class="status">
      <div class="dot" id="conn-dot"></div>
      <span id="conn-text">Checking Desktop Status...</span>
    </div>
    <div class="tab-info" id="current-tab">Reading active browser page...</div>
  </div>

  <!-- Connect to Hive Button -->
  <button class="btn-connect" id="connect-hive-btn">
    <span>🔗</span> Connect to Hive Desktop
  </button>

  <!-- Send Active Page Button -->
  <button class="btn-primary" id="send-tab-btn">
    <span>⚡</span> Send Active Page to Hive
  </button>

  <div class="footer">Hive Autonomous Browser Companion</div>

  <script src="popup.js"></script>
</body>
</html>
